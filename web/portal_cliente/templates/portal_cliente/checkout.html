{% extends 'portal_cliente/base.html' %}
{% block content %}
<h1 class="text-2xl font-bold text-slate-900 mb-6">Finalizar Compra</h1>
<form method="POST" class="bg-white p-6 rounded-xl border max-w-2xl mx-auto space-y-6">
  {% csrf_token %}
  <div>
    <label class="block font-bold text-slate-700 mb-2">Método de Entrega</label>
    <div class="grid grid-cols-2 gap-4">
      <label class="border p-4 rounded-xl flex items-center gap-3 cursor-pointer hover:border-blue-600">
        <input type="radio" name="tipo_entrega" value="DOMICILIO" checked>
        <div>
          <p class="font-semibold text-sm">A Domicilio</p>
          <p class="text-xs text-slate-500">Envío centralizado (+$1.50)</p>
        </div>
      </label>
      <label class="border p-4 rounded-xl flex items-center gap-3 cursor-pointer hover:border-blue-600">
        <input type="radio" name="tipo_entrega" value="RETIRO">
        <div>
          <p class="font-semibold text-sm">Retiro en Sucursal</p>
          <p class="text-xs text-slate-500">Sin costo de envío</p>
        </div>
      </label>
    </div>
  </div>

  <div id="campo-direccion">
    <label class="block text-sm font-medium text-slate-700 mb-1">Dirección de Entrega</label>
    <select name="id_direccion" class="w-full px-3 py-2 border rounded-lg text-sm">
      {% for d in direcciones %}
        <option value="{{ d.id_direccion }}">{{ d.detalle_direccion }} ({{ d.id_municipio.nombre }})</option>
      {% empty %}
        <option value="">No tienes direcciones. Agrega una en tu perfil.</option>
      {% endfor %}
    </select>
  </div>

  <div id="campo-sucursal">
    <label class="block text-sm font-medium text-slate-700 mb-1">Sucursal de Retiro</label>
    <select name="id_sucursal" class="w-full px-3 py-2 border rounded-lg text-sm">
      {% for s in sucursales %}
        <option value="{{ s.id_sucursal }}">{{ s.nombre }} - {{ s.direccion }}</option>
      {% endfor %}
    </select>
  </div>

  <div>
    <label class="block font-bold text-slate-700 mb-2">Método de Pago</label>
    <div class="grid grid-cols-2 gap-4">
      <label class="border p-4 rounded-xl flex items-center gap-3 cursor-pointer hover:border-blue-600">
        <input type="radio" name="metodo_pago" value="CONTRA_ENTREGA" checked>
        <div>
          <p class="font-semibold text-sm">Contra Entrega</p>
          <p class="text-xs text-slate-500">Efectivo al recibir</p>
        </div>
      </label>
      <label class="border p-4 rounded-xl flex items-center gap-3 cursor-pointer hover:border-blue-600">
        <input type="radio" name="metodo_pago" value="TRANSFERENCIA">
        <div>
          <p class="font-semibold text-sm">Transferencia</p>
          <p class="text-xs text-slate-500">Comprobante digital</p>
        </div>
      </label>
    </div>
  </div>

  <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl transition">
    Confirmar y Pagar
  </button>
</form>
{% endblock %}
