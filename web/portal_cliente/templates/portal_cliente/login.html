{% extends 'portal_cliente/base.html' %}

{% block title %}Iniciar Sesión - Portal Cliente{% endblock %}

{% block content %}
<div class="checkout-card" style="max-width: 420px; margin: 3rem auto;">
  <h2 style="font-size: 1.4rem; font-weight: 800; text-align: center; margin-bottom: 1.5rem;">
    Portal de Clientes
  </h2>

  <form method="POST" action="{% url 'login' %}">
    {% csrf_token %}
    <div style="margin-bottom: 1.25rem;">
      <label for="email" style="display: block; font-size: 0.85rem; font-weight: 700; margin-bottom: 0.4rem;">
        Correo Electrónico
      </label>
      <input type="email" id="email" name="email" required class="search-input" style="width: 100%;" placeholder="cliente@minimarket.test">
    </div>

    <div style="margin-bottom: 1.75rem;">
      <label for="password" style="display: block; font-size: 0.85rem; font-weight: 700; margin-bottom: 0.4rem;">
        Contraseña
      </label>
      <input type="password" id="password" name="password" required class="search-input" style="width: 100%;" placeholder="••••••••">
    </div>

    <button type="submit" class="btn btn-primary btn-block" style="padding: 0.8rem;">
      Iniciar Sesión
    </button>
  </form>
</div>
{% endblock %}
