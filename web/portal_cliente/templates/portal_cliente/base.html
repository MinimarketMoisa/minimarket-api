{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Minimarket Digital{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/styles.css' %}">
  <!-- Script anti-parpadeo de tema oscuro -->
  <script>
    if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    } else {
      document.documentElement.classList.remove('dark');
    }
  </script>
</head>
<body>
  <header class="header">
    <div class="container header-inner">
      <a href="{% url 'catalogo' %}" class="brand-link">
        <span>🛒</span>
        <span>Minimarket</span>
      </a>

      <nav class="nav-group">
        <a href="{% url 'catalogo' %}" class="nav-link">Catálogo</a>
        <a href="{% url 'pedidos' %}" class="nav-link">Pedidos</a>
        <a href="{% url 'perfil' %}" class="nav-link">Perfil</a>
        
        <a href="{% url 'carrito' %}" class="nav-cart-btn">
          <span>Carrito</span>
          <span class="cart-counter">{{ cart_count|default:"0" }}</span>
        </a>

        <!-- Botón Toggle de Modo Oscuro -->
        <button id="themeToggle" class="theme-toggle-btn" title="Alternar tema" type="button">
          🌓
        </button>

        <a href="{% url 'logout' %}" class="nav-link logout-link">Salir</a>
      </nav>
    </div>
  </header>

  <main class="main-content container">
    {% if messages %}
      {% for msg in messages %}
        <div class="alert {% if msg.tags == 'error' %}alert-error{% elif msg.tags == 'warning' %}alert-warning{% else %}alert-success{% endif %}">
          {{ msg }}
        </div>
      {% endfor %}
    {% endif %}

    {% block content %}{% endblock %}
  </main>

  <script>
    // Toggle manual y persistente de Modo Claro / Modo Oscuro
    const toggleBtn = document.getElementById('themeToggle');
    toggleBtn.addEventListener('click', () => {
      const isDark = document.documentElement.classList.toggle('dark');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
    });
  </script>
</body>
</html>
