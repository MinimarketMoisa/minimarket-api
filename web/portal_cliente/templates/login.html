{% extends 'portal_cliente/base.html' %}

{% block content %}
<div style="max-width: 420px; margin: 4rem auto; padding: 2rem; border: 1px solid #e2e8f0; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); font-family: sans-serif;">
    <h2 style="margin-bottom: 1.5rem; text-align: center;">Iniciar Sesión - Portal Clientes</h2>

    {% if messages %}
        <div style="margin-bottom: 1rem;">
            {% for message in messages %}
                <div style="padding: 0.75rem; border-radius: 4px; margin-bottom: 0.5rem; {% if message.tags == 'error' %}background-color: #fee2e2; color: #991b1b;{% else %}background-color: #dcfce7; color: #166534;{% endif %}">
                    {{ message }}
                </div>
            {% endfor %}
        </div>
    {% endif %}

    <form method="POST" action="{% url 'login' %}">
        {% csrf_token %}
        <div style="margin-bottom: 1rem;">
            <label for="email" style="display: block; margin-bottom: 0.25rem; font-weight: bold;">Correo Electrónico:</label>
            <input type="email" id="email" name="email" required style="width: 100%; padding: 0.5rem; border: 1px solid #cbd5e1; border-radius: 4px; box-sizing: border-box;" placeholder="cliente@minimarket.test">
        </div>

        <div style="margin-bottom: 1.5rem;">
            <label for="password" style="display: block; margin-bottom: 0.25rem; font-weight: bold;">Contraseña:</label>
            <input type="password" id="password" name="password" required style="width: 100%; padding: 0.5rem; border: 1px solid #cbd5e1; border-radius: 4px; box-sizing: border-box;" placeholder="••••••••">
        </div>

        <button type="submit" style="width: 100%; padding: 0.75rem; background-color: #2563eb; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer;">
            Entrar
        </button>
    </form>
</div>
{% endblock %}
